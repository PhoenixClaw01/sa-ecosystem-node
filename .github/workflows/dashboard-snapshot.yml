name: Snapshot DAO balances

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-balance-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read balances from the public RPC
        run: node scripts/snapshot-balances.mjs
        env:
          RPC_URL: https://api.mainnet-beta.solana.com
      - name: Commit balances.json if it changed
        run: |
          git add -- balances.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          names="$(git diff --cached --name-only)"
          test "$names" = "dashboard/balances.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Balance snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
