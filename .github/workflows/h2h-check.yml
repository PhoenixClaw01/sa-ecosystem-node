name: h2h-check

# Reads issue comments and pull request review comments, then writes a claim
# ledger to the job summary. It does not comment, label, or push.
#
# A pull request conversation comment arrives as issue_comment. This file
# runs from the default branch. The checkout ref is that branch, so a pull
# request head is not checked out and its scripts are not run.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write the claim ledger to the job summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types protocol/h2h/checker/cli.ts --github-summary
